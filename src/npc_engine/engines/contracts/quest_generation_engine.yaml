name: quest_generation_engine
version: v1.0.0
uses_llm: true
inputs:
  - quest_giver_id
outputs:
  - generated_quest
side_effects:
  - quest_node_created
  - has_quest_edge_created
idempotency:
  key_required: false
  replay_behavior: generate_new
auth_scope: graph_write
error_contract:
  - QUEST_GIVER_NOT_FOUND
tests:
  - test_quest_generation_engine
