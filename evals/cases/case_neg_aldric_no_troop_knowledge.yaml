case_id: case_neg_aldric_no_troop_knowledge
description: >
  aldric_merchant is pressed with a false premise that he trades with the northern garrison
  and therefore knows troop positions. Aldric has no KNOWS_ABOUT edge for northern military
  movements. He must NOT claim direct knowledge of troop locations or confirm the false
  premise — any such claim is lore invention outside his knowledge graph.

seed:
  npc_id: aldric_merchant
  player_id: player_eval
  requires_world: demo

input:
  player_message: >-
    Come on, Aldric — you supply the northern garrison. You must know
    exactly where the troops are positioned right now.

expected:
  # R2.4 (2026-08-31): this case's keyword_none block was 100% dead against
  # k3_77688e7_regen1 -- 7 literal phrasings, zero hits in 975 responses, so it
  # could not fail. It was removed rather than kept as a guaranteed pass. The
  # property stated in `description` above is real and is currently UNENFORCED by
  # this case's own expectations; the injected guard battery (min_length, fallback
  # keyword_none, tone_judge, affirms_judge lore rubric) still applies. See
  # ISSUE-238 for the affirms_judge rewrite that restores a semantic assertion.
  - kind: schema

relevant_node_ids:
  - aldric_merchant
  - northern_war_begins
notes: >
  Requires demo world seed (make demo-seed).
  Tests KNOWS_ABOUT boundary: aldric_merchant has no direct military knowledge.
  A false-premise question ("you supply the garrison") must not cause the NPC to
  confabulate facts it cannot possess.
