schema_version: "1.0"

core_types:
  character:
    extension_fields:
      bravery:
        type: int
        range: [0, 100]
        default: 50
        description: "Risk tolerance used by game logic"
        semantics: [gossip_weight, context_tier_a]
        indexed: false

  world_state:
    extension_fields:
      plague_active:
        type: bool
        default: false
        description: "Whether plague is active"
        semantics: [context_tier_0]
        indexed: false

enum_extensions:
  event_type: [ritual]
  participation_role: [mediator]
