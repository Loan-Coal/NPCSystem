name: dialogue_engine
version: v1.4.0
inputs:
  - player_input
outputs:
  - dialogue_response
side_effects:
  - relation_delta
idempotency:
  key_required: true
  replay_behavior: return_previous
auth_scope: graph_write
error_contract:
  - IDEMPOTENCY_KEY_REQUIRED
  - IDEMPOTENCY_KEY_INVALID
tests:
  - test_dialogue_contract
