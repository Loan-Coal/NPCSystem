node_type: event
fields:
  id: { type: str, required: true }
  summary: { type: str, required: true }
  severity: { type: int, required: true, range: [0, 100] }
  location_id: { type: str, required: true }
  occurred_at: { type: str, required: true }
  tick_id: { type: int, required: true }
  event_type: { type: str, required: true }
  is_public: { type: bool, required: true }
  producer: { type: str, required: false }
  origin_engine: { type: str, required: false }
  schema_version: { type: str, required: false }
  provenance: { type: dict, values_type: str, required: false }
  src_character_id: { type: str, required: false }
  last_graph_updated_at: { type: str, required: true }
