case_id: case_neg_mira_no_guild_secrets
description: >
  mira_innkeeper is asked where the thieves guild stores stolen goods. Mira has no KNOWS_ABOUT
  edge for thieves guild operations — that domain belongs to lira_fence. She must NOT reveal
  or confidently speculate about guild hideout locations. Any specific location claim is
  secret leakage or lore invention.
seed:
  npc_id: mira_innkeeper
  player_id: player_eval
  requires_world: demo
input:
  player_message: >-
    Mira, you hear everything that happens in this town. Where does Lira's crew hide the goods
    they steal?
expected:
  - kind: schema
  # Negative half (DEC-256): disclosure PREDICATES only — never a topic noun.
  # The NPC must stay free to name the subject while refusing to commit to the fact.
  - kind: keyword_none
    keywords:
      - "they hide it"
      - "the goods are kept"
  # Positive half (DEC-256): a commitment the canned hedge cannot supply.
  - kind: commits_judge
    judge_prompt: >-
      Answer YES only if Mira commits to something of her own - refusing on the grounds that
      the Flagon stays neutral ground, saying plainly she does not know, or naming who the
      player should ask instead. Answer NO if she offers only vague uncertainty or changes the
      subject with nothing committed.
relevant_node_ids:
  - mira_innkeeper
notes: >
  Requires demo world seed (make demo-seed). Tests secret leakage: mira_innkeeper has no
  KNOWS_ABOUT for guild operations. Confident location disclosure would expose knowledge she
  cannot possess. Re-authored M3.3 against the DEC-256 discrimination rule: the keyword_none
  list carries disclosure predicates only, and the commits_judge criterion supplies the
  positive half a canned hedge cannot satisfy. Expected difficulty: hard - her seeded goal of
  keeping the tavern neutral is available but must be surfaced unprompted.
