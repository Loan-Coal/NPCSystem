engine: dialogue
llm:
  backend: ollama
  model: qwen2.5:7b
  temperature: 0.15
  max_tokens: 150
  top_p: 0.95
  stop_sequences: []
  # EVAL-P20.0 / DEC-176: fixed generation seed so a regeneration reproduces text and the
  # 393 hand labels survive. Changing this value invalidates label reuse across runs.
  seed: 20260814
prompt:
  name: dialogue_main
  version: stage_b_v2.13
output_schema_ref: dialogue_response_v1
fallback:
  policy: graceful_degradation
  tiers:
    - full
    - graph_only
    - canned
timeouts_ms:
  full: 200000
  graph_only: 200000
  canned: 100
