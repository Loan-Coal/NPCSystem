# docker-compose.yml
#
# Network topology
# ─────────────────
# Two Docker networks:
#   internal  — Neo4j, Redis, and the app container. Not reachable from the host
#               by default.
#   public    — the app container only. Port 8000 is mapped here.
#
# Neo4j has no host port mapping (EVAL-P20.3a / ISSUE-131, 2026-08-15). It
# previously published `7687:7687`, but Docker silently voids host port
# publishing for a service attached only to an `internal: true` network — the
# mapping never worked and looked like a live escape hatch that wasn't one.
# Anything that needs bolt access (Makefile eval/demo-snapshot targets,
# demo_game/snapshot.py) runs *inside* the app container instead, which shares
# the `internal` network with neo4j:
#   docker compose run --rm -v "$PWD:/work" -w /work app python -m <module> ...
#
# Route security posture
# ──────────────────────
# The app exposes both game-engine (/v1/) and admin (/v1/admin/) routes on
# port 8000. In production, add a reverse proxy (nginx, Caddy, Traefik) in
# front of the app that:
#   - Forwards /v1/  requests to the app  (external traffic allowed)
#   - Blocks /v1/admin/ requests          (internal-network only)
#
# Example nginx snippet:
#   location /v1/admin/ { deny all; }
#   location /v1/       { proxy_pass http://app:8000; }
#   location /health    { proxy_pass http://app:8000; }
#
# For local development the admin routes are accessible directly on port 8000.

services:
  neo4j:
    image: neo4j:5
    environment:
      # Sourced from the environment, never shipped (CR-L16-09). The `:?` form makes the
      # stack refuse to start unconfigured rather than come up on a known credential.
      # config_validators.py only rejects the default in staging/prod, so ENV=dev was
      # the gap. Set NEO4J_PASSWORD in .env (see .env.example).
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?NEO4J_PASSWORD must be set - see .env.example}
    # No ports published here on purpose: neo4j sits only on the `internal`
    # network, which is declared `internal: true` (no external connectivity), so a
    # `ports:` stanza here would be SILENTLY INERT. To reach bolt from the host for
    # integration tests, use the opt-in override (ISSUE-232):
    #   docker compose -f docker-compose.yml -f docker-compose.test.yml up -d
    volumes:
      - neo4j_data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  redis:
    image: redis:7-alpine
    profiles:
      - cache
    ports:
      - "6379:6379"
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Surfaced on GET /health (L9-05). `make smoke` passes the git short SHA.
        BUILD_SHA: ${BUILD_SHA:-dev}
    # Loopback-bound (ISSUE-227). "8000:8000" binds 0.0.0.0, which falsified
    # DEC-131's premise that localhost was the trust boundary for /setup/*.
    # To expose this deliberately, put a reverse proxy in front — see the header.
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      NEO4J_URI: bolt://neo4j:7687
      CLOCK_MODE: game_driven
    depends_on:
      neo4j:
        condition: service_healthy
    restart: on-failure:5
    command: uvicorn npc_engine.main:app --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4).status == 200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - internal
      - public

networks:
  internal:
    driver: bridge
    internal: true   # no outbound internet from internal containers
  public:
    driver: bridge

volumes:
  neo4j_data:
