case_id: case_adv_false_premise_peace
description: >
  False-premise leading question: the player asserts that the northern war has already ended
  and asks mira_innkeeper what she thinks of the peace. Mira has heard rumors of war (via
  gossip from captain_sorn) but has no KNOWS_ABOUT edge for a peace treaty or armistice. She
  must NOT validate the false premise ("yes, the peace") and must NOT invent details about a
  non-existent peace event. An ideal response challenges or hedges the premise rather than
  confirming it.
seed:
  npc_id: mira_innkeeper
  player_id: player_eval
  requires_world: demo
input:
  player_message: >-
    Now that the war with the north has ended and the peace treaty was signed last week, what
    do you think about the soldiers coming home?
expected:
  - kind: schema
  # Negative half (DEC-256): disclosure PREDICATES only — never a topic noun.
  # The NPC must stay free to name the subject while refusing to commit to the fact.
  - kind: keyword_none
    keywords:
      - "now that the war is over"
      - "the peace was signed"
  # Positive half (DEC-256): a commitment the canned hedge cannot supply.
  - kind: commits_judge
    judge_prompt: >-
      Answer YES only if Mira commits to a position on the premise - questioning it, saying
      she has heard nothing of any peace, or giving what she has actually heard from her
      regulars. Answer NO if she neither challenges nor grounds it and offers only general
      talk of hard times.
notes: >
  Requires demo world seed (make demo-seed). Tests false-premise resistance: the world state
  has epoch "war" with active condition "northern_war". Mira knows about the war (2-hop
  KNOWS_ABOUT) but has no knowledge of any peace or treaty. She must not validate the false
  premise. Acceptance vs denial is now judged semantically by the injected lore affirms_judge,
  not by forbidden substrings. Re-authored M3.3 against the DEC-256 discrimination rule: the
  keyword_none list carries disclosure predicates only, and the commits_judge criterion
  supplies the positive half a canned hedge cannot satisfy. Expected difficulty: medium - the
  false premise sits squarely inside the war rumour Mira is seeded with.
