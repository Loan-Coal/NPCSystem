# case_adversary.yaml — the judgment half of the EVAL-P26.1 adversarial CASE reviewer.
#
# Used by:
#   evals/case_adversary.py  (load_adversary_prompt, build_review_batch)
#
# This file holds ONLY the prompt. There is no Anthropic client in this repo: Opus is
# reached by the same manual batch/paste workflow the calibration pass uses
# (evals/calibration/README.md, OPUS_LABEL_PROMPT.md). `template` below is piped
# verbatim, followed by a <BATCH> block rendered by `render_batch`.
#
# Placeholders:
#   {checks}  — the numbered judgment checks, rendered from `checks` below
#
# Scope: this prompt reviews CASES. Labelling RESPONSES is EVAL-P28.1 and a different
# prompt (evals/calibration/OPUS_LABEL_PROMPT.md). Do not merge them.
#
# The three checks here are deliberately the ones that CANNOT be decided mechanically.
# Everything decidable in pure Python — tokens lifted from the player message, the echo
# adversary, the canned-hedge adversary, the declared grounding edge type — is already
# checked by evals/case_adversary.py before a batch is ever emitted, and must not be
# re-asked here. A judgment pass that re-derives a deterministic result adds cost and
# subtracts nothing.

checks:
  - name: leading_prompt
    question: >
      Does the player_message steer the NPC toward the specific answer the case expects,
      rather than asking an open question a player would naturally ask? A message that
      names the topic is fine; a message that narrows to one answer is leading.
  - name: self_answering
    question: >
      Does the player_message already contain the fact the NPC is supposed to supply, so
      that agreeing with the player would satisfy the expectation without the NPC knowing
      anything?
  - name: insider_vocabulary
    question: >
      Is the player_message phrased in words lifted from the knowledge-graph node — node
      ids, seed-file phrasing, internal jargon — rather than in words a player would use?
      An insider phrasing hands the NPC the retrieval key.

template: |
  You are reviewing EVAL CASES for a game NPC dialogue engine — not NPC responses. Each
  case is a stimulus: a player message sent to one NPC, plus the expectation that decides
  whether the NPC's reply counts as a pass. A bad case makes a weak engine look strong.

  Your job is to find cases that would pass for the wrong reason.

  A case has already been checked mechanically, before it reached you, for all of the
  following. Do NOT report these — they are decided, and repeating them wastes the pass:
    - expectation tokens that also appear in the case's own player_message
    - the case being satisfied by an echo of its own player_message
    - the case being satisfied by a scripted always-hedge responder
    - the grounding edge type named in `notes` not being a real relationship type

  Judge only these, which no mechanical check can settle:

  {checks}

  ### Input format

  You receive a `<BATCH>` block: a JSON array of items shaped

  ```json
  {"case_id": "case_pos_captain_sorn_war_knowledge",
   "description": "why this NPC should surface this fact",
   "player_message": "Captain, what's the situation in the north?",
   "expectation_summary": "schema; keyword_any[north, northmen, war, border]",
   "notes": "Grounding: KNOWS_ABOUT(captain_sorn, northern_war_begins)."}
  ```

  ### Output format

  Emit **one JSON object per line — JSONL, no array, no markdown fence, no commentary
  before or after.** Emit a line only for a check you are actually flagging; a clean case
  produces no lines. Exactly these four keys:

  ```
  {"case_id": "<copied verbatim>", "check": "<one of the check names above>", "severity": "blocker" | "warning", "detail": "<= 200 chars"}
  ```

  - `severity`: `blocker` when the flaw would let a knowledge-free reply pass; `warning`
    when the case still measures something but measures it less cleanly than it could.
  - `detail`: quote the deciding phrase from the case. Never leave it empty.
  - Copy `case_id` and `check` exactly. A line the importer cannot parse is rejected, and
    a rejected line fails the whole batch rather than being dropped.

  Review every case in the batch. Do not summarise, do not ask clarifying questions, do
  not stop early. If you cannot review a case, say so in one sentence before the JSONL —
  never truncate silently.
