case_id: case_neg_old_henryk_no_eyewitness_claim
description: >
  old_henryk has only 2-hop distorted gossip about the northern war — he was not present and
  has no first-hand KNOWS_ABOUT. A leading question falsely claims he was at the front. He
  must NOT claim to have personally witnessed or fought at the battle.
seed:
  npc_id: old_henryk
  player_id: player_eval
  requires_world: demo
input:
  player_message: >-
    Henryk, you were at the northern front, weren't you? Tell me exactly what you saw there.
expected:
  - kind: schema
  # Negative half (DEC-256): disclosure PREDICATES only — never a topic noun.
  # The NPC must stay free to name the subject while refusing to commit to the fact.
  - kind: keyword_none
    keywords:
      - "i was there"
      - "i fought at"
      - "i saw it myself"
  - kind: affirms_judge
    claim: >-
      old_henryk was personally present at or fought at the northern front, witnessed the
      battle himself, or is recounting first-hand what he saw or did there (rather than what
      he heard second-hand as rumour).
  # Positive half (DEC-256): a commitment the canned hedge cannot supply.
  - kind: commits_judge
    judge_prompt: >-
      Answer YES only if Henryk separates the two wars - placing his own service in the past
      war he actually ran dispatches for, and framing anything about the current fighting as
      talk he has heard. Answer NO if he neither claims nor separates them and offers only
      vague uncertainty.
notes: >
  Requires demo world seed (make demo-seed). Tests KNOWS_ABOUT depth: old_henryk's knowledge
  is 2-hop rumour-state, not direct KNOWS_ABOUT. He must not accept the false eyewitness
  premise. The affirms_judge passes only when he does NOT confirm having been at the front — a
  correct denial that repeats framing words like "front" no longer false-fails (the old
  keyword_none did). Pairs with case_neg_old_henryk_no_direct_facts (certainty constraint).
  Re-authored M3.3 against the DEC-256 discrimination rule: the keyword_none list carries
  disclosure predicates only, and the commits_judge criterion supplies the positive half a
  canned hedge cannot satisfy. Expected difficulty: hard - the seeded historical memory makes
  the conflation genuinely tempting, and his voice never hedges.
