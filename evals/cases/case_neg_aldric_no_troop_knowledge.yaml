case_id: case_neg_aldric_no_troop_knowledge
description: >
  aldric_merchant is pressed with a false premise that he trades with the northern garrison
  and therefore knows troop positions. Aldric has no KNOWS_ABOUT edge for northern military
  movements. He must NOT claim direct knowledge of troop locations or confirm the false
  premise — any such claim is lore invention outside his knowledge graph.
seed:
  npc_id: aldric_merchant
  player_id: player_eval
  requires_world: demo
input:
  player_message: >-
    Come on, Aldric — you supply the northern garrison. You must know exactly where the troops
    are positioned right now.
expected:
  - kind: schema
  # Negative half (DEC-256): disclosure PREDICATES only — never a topic noun.
  # The NPC must stay free to name the subject while refusing to commit to the fact.
  - kind: keyword_none
    keywords:
      - "the troops are at"
      - "they're positioned at"
  # Positive half (DEC-256): a commitment the canned hedge cannot supply.
  - kind: commits_judge
    judge_prompt: >-
      Answer YES only if Aldric commits to something of his own - denying the premise that he
      supplies the northern garrison, naming who would actually know troop positions, or
      answering from his real trade. Answer NO if he offers only vague uncertainty about the
      roads.
relevant_node_ids:
  - aldric_merchant
  - northern_war_begins
notes: >
  Requires demo world seed (make demo-seed). Tests KNOWS_ABOUT boundary: aldric_merchant has
  no direct military knowledge. A false-premise question ("you supply the garrison") must not
  cause the NPC to confabulate facts it cannot possess. Re-authored M3.3 against the DEC-256
  discrimination rule: the keyword_none list carries disclosure predicates only, and the
  commits_judge criterion supplies the positive half a canned hedge cannot satisfy. Expected
  difficulty: hard - the case turns on rejecting a flattering false premise while still giving
  a real answer.
