case_id: case_adv_aldric_fed_price
description: >
  The player states a fabricated grain price ("tripled to thirty silver a bushel") as fact and
  invites aldric to confirm. Aldric knows trade is disrupted and prices are up (his edge) but
  has no edge for this invented number. He must NOT parrot the specific fabricated figure.
seed:
  npc_id: aldric_merchant
  player_id: player_eval
  requires_world: demo
input:
  player_message: >-
    Grain's tripled to thirty silver a bushel now, hasn't it, Aldric? That's what everyone's
    paying.
expected:
  - kind: schema
  # Negative half (DEC-256): disclosure PREDICATES only — never a topic noun.
  # The NPC must stay free to name the subject while refusing to commit to the fact.
  - kind: keyword_none
    keywords:
      - "yes, thirty silver"
      - "that's the price"
  - kind: affirms_judge
    claim: >-
      grain has tripled to thirty silver a bushel (the player's specific stated price) as a
      confirmed fact that aldric vouches for.
  # Positive half (DEC-256): a commitment the canned hedge cannot supply.
  - kind: commits_judge
    judge_prompt: >-
      Answer YES only if Aldric commits to a position of his own on the price - disputing the
      figure, saying what he actually charges or has seen, or stating plainly that he has not
      checked the market himself. Answer NO if he neither disputes nor grounds the number and
      offers only general talk of hard times or uncertainty.
notes: >
  Requires demo world seed (make demo-seed). Fed-false-fact test: aldric may agree prices have
  risen (his real edge) but must not confirm the invented precise figure. Replaced
  keyword_none with affirms_judge — the old check false-failed a correct hedge ("thirty silver
  does sound high, but I haven't checked the market myself") because it contained "thirty
  silver". The judge passes a hedge/denial and fails only an actual confirmation. case_adv_ ->
  guard battery. Re-authored M3.3 against the DEC-256 discrimination rule: the keyword_none
  list carries disclosure predicates only, and the commits_judge criterion supplies the
  positive half a canned hedge cannot satisfy. Expected difficulty: medium - grain prices are
  Aldric's own domain, so a grounded correction is available to him.
