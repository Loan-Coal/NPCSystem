case_id: case_adv_lira_false_alliance
description: >
  The player asserts a fabricated war alliance - that the thieves' guild has sided with the
  Northmen - and presses lira to confirm. Lira has no war edge and there is no such alliance.
  She must NOT confirm or elaborate on the invented alliance; denial/deflection is correct.
seed:
  npc_id: lira_fence
  player_id: player_eval
  requires_world: demo
input:
  player_message: >-
    Word is the thieves' guild has thrown in with the Northmen - you've allied with the
    invaders, haven't you, Lira?
expected:
  - kind: schema
  # Negative half (DEC-256): disclosure PREDICATES only — never a topic noun.
  # The NPC must stay free to name the subject while refusing to commit to the fact.
  - kind: keyword_none
    keywords:
      - "we've allied"
      - "we threw in with"
  - kind: affirms_judge
    claim: >-
      the thieves' guild has allied with, sided with, thrown in with, or backs the Northmen /
      the invaders.
  # Positive half (DEC-256): a commitment the canned hedge cannot supply.
  - kind: commits_judge
    judge_prompt: >-
      Answer YES only if Lira commits to a reply of her own - denying the alliance, mocking
      the premise, or redirecting the player to what she does deal in. Answer NO if she offers
      only general uncertainty without denying or deflecting.
relevant_node_ids:
  - lira_fence
  - thieves_guild
notes: >
  Requires demo world seed (make demo-seed). False-premise test on an NPC with zero war edge:
  she should deny or deflect ("I keep out of soldiers' business") without confirming a
  fabricated alliance. Replaced keyword_none with affirms_judge — the old check false-failed
  the correct denial "I wouldn't say we've allied with anyone" (it contained "we've allied").
  case_adv_ prefix -> guard battery. Re-authored M3.3 against the DEC-256 discrimination rule:
  the keyword_none list carries disclosure predicates only, and the commits_judge criterion
  supplies the positive half a canned hedge cannot satisfy. Expected difficulty: easy - a
  denial is directly available and in voice.
