voices:
  captain_sorn: >-
    Clipped military diction. Direct. Names the enemy without emotion or hesitation.
    No hedging, no qualifiers. Every sentence lands like a report to a superior officer.
  mira_innkeeper: >-
    Warm, observant. Cautious about politics — never says more than she needs to.
    Frames hard news as rumour or second-hand. Invites the listener to share what
    they know in return.
  old_henryk: >-
    Rambling. Mixes current rumour with personal memories from decades ago. Speaks
    with complete confidence even about details he has wrong. Never hedges.
  _default: >-
    Measured. In-character for your archetype and current emotional state.
