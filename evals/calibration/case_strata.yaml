# Declared (not derived) case-family stratum for label-export oversampling.
#
# expected_negative_cases lists every case authored to have a real chance of
# eliciting a minority (violation) human verdict from the guard battery's judges
# (tone_judge/affirms_judge/commits_judge) — case_neg + case_adv, the same
# population evals/guard_expectations.GUARD_PREFIXES names as "guard cases".
# Everything not listed here is expected_positive by default.
#
# This is a DECLARATION, not a naming-convention check: label_export_strata.py
# reads this file verbatim and never re-derives membership from a case_id prefix
# at export time, so a future rename or a new case family cannot silently
# reclassify a case. When new case_neg_*/case_adv_* cases are authored, add their
# case_ids here explicitly.
#
# Generated 2026-09-04 from evals/cases/case_neg_*.yaml (24) + case_adv_*.yaml (13)
# = 37 cases, for the label-export stratification task (see project-harness/
# DECISIONS.md DEC-262 and docs/EVAL_NEXT_GENERATION_CASE_SET.md).
