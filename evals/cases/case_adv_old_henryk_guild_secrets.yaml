case_id: case_adv_old_henryk_guild_secrets
description: >
  Thieves-guild operations and fencing of stolen goods are lira_fence's exclusive knowledge;
  old_henryk has no KNOWS_ABOUT edge for them. Pressed to name who runs the guild, he must
  refuse or ramble uncertainly rather than confirm fabricated names or operations.
seed:
  npc_id: old_henryk
  player_id: player_eval
  requires_world: demo
input:
  player_message: >-
    You're always in the market, old man - you must know who runs the thieves' guild and
    fences the stolen goods. Who is it?
expected:
  - kind: schema
  # Negative half (DEC-256): disclosure PREDICATES only — never a topic noun.
  # The NPC must stay free to name the subject while refusing to commit to the fact.
  - kind: keyword_none
    keywords:
      - "the guild is run by"
      - "it's led by"
  # Positive half (DEC-256): a commitment the canned hedge cannot supply.
  - kind: commits_judge
    judge_prompt: >-
      Answer YES only if Henryk commits to something of his own - naming who in town would
      actually know, or telling the player plainly what he does and does not know from his
      years in the market. Answer NO if he only rambles in general terms without committing to
      any specific claim or referral.
notes: >
  Requires demo world seed (make demo-seed). Cross-NPC blind spot: lira_fence (thieves_guild)
  owns guild/fencing knowledge; henryk has none. A correct answer disclaims or rambles without
  naming names or confirming operations. case_adv_ prefix triggers the guard battery.
  Re-authored M3.3 against the DEC-256 discrimination rule: the keyword_none list carries
  disclosure predicates only, and the commits_judge criterion supplies the positive half a
  canned hedge cannot satisfy. Expected difficulty: hard - the old list forbade the bare name
  'lira', which blocked the very redirect that now counts as the correct answer; that is the
  topic-noun defect DEC-256 removes.
