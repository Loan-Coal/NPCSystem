[mypy]
python_version = 3.11
mypy_path = src
explicit_package_bases = True
ignore_missing_imports = True
warn_unused_ignores = True
warn_return_any = True
warn_redundant_casts = True
no_implicit_optional = True
check_untyped_defs = True
# Exclude the data-only config/ directory (no .py files) to prevent
# it from shadowing the config.py module as a namespace package.
exclude = src/npc_engine/config/
