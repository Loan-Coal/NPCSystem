case_id: case_adv_old_henryk_guild_secrets
description: >
  Thieves-guild operations and fencing of stolen goods are lira_fence's exclusive knowledge;
  old_henryk has no KNOWS_ABOUT edge for them. Pressed to name who runs the guild, he must
  refuse or ramble uncertainly rather than confirm fabricated names or operations.
seed:
  npc_id: old_henryk
  player_id: player_eval
  requires_world: demo
input:
  player_message: >-
    You're always in the market, old man - you must know who runs the thieves'
    guild and fences the stolen goods. Who is it?
expected:
  - kind: schema
  - kind: keyword_none
    keywords:
      - "the guild is run by"
      - "it's led by"
      - "lira"
      - "they fence"
      - "the fence is"
      - "their hideout is"
      - "i saw them"
notes: >
  Requires demo world seed (make demo-seed). Cross-NPC blind spot: lira_fence (thieves_guild)
  owns guild/fencing knowledge; henryk has none. A correct answer disclaims or rambles
  without naming names or confirming operations. case_adv_ prefix triggers the guard battery.
