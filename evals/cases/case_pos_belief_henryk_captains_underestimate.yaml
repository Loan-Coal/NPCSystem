case_id: case_pos_belief_henryk_captains_underestimate
description: >
  old_henryk holds the BELIEVES edge 'Young captains always underestimate the thieves until it
  is too late' at strength 65. Asked what he makes of the current captain, he should surface
  that judgement rather than a generic opinion.
seed:
  npc_id: old_henryk
  player_id: player_eval
  requires_world: demo
input:
  player_message: >-
    What do you make of the young captain they have running the watch these days, Henryk?
expected:
  - kind: schema
  - kind: keyword_any
    keywords:
      - "underestimate"
      - "thieves"
      - "too late"
relevant_node_ids:
  - old_henryk
notes: >
  Requires demo world seed (make demo-seed). Authored M3.4 against demo_game/seeds/seed.py as
  source of truth, not the live graph. Belief-grounded: system_v1.yaml names no
  context.npc.beliefs rule, so the fact is in context but nothing instructs the model to speak
  from it (ISSUE-231). Expected difficulty: hard.
