case_id: case_neg_captain_sorn_no_gossip_frame
description: >
  captain_sorn responds to a direct intelligence query. He has authoritative KNOWS_ABOUT the
  war event and must NOT frame his knowledge as gossip or use conversational hedging ("between
  you and me", "I overheard"). That framing belongs to rumour-state NPCs.
seed:
  npc_id: captain_sorn
  player_id: player_eval
  requires_world: demo
input:
  player_message: >-
    Tell me what you know about the Northmen.
expected:
  - kind: schema
  # Negative half (DEC-256): disclosure PREDICATES only — never a topic noun.
  # The NPC must stay free to name the subject while refusing to commit to the fact.
  - kind: keyword_none
    keywords:
      - "between you and me"
      - "i overheard"
      - "they say"
      - "rumour has it"
  # Positive half (DEC-256): a commitment the canned hedge cannot supply.
  - kind: commits_judge
    judge_prompt: >-
      Answer YES only if Sorn states what he knows of the Northmen as his own knowledge, on
      his own authority - a direct account of the war beginning or of the watch's posture.
      Answer NO if he attributes it to talk, hedges it as rumour, or gives only general
      uncertainty.
notes: >
  Requires demo world seed (make demo-seed). Re-authored M3.3 against the DEC-256
  discrimination rule: the keyword_none list carries disclosure predicates only, and the
  commits_judge criterion supplies the positive half a canned hedge cannot satisfy. Expected
  difficulty: medium - Sorn holds the direct KNOWS_ABOUT edge, so an authoritative account is
  available and correct.
