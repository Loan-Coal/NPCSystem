# P6 (2026-08-26): v1.4 -> v1.5. The serialized context SCHEMA changed -- it is now
# generated from retrieval/context/context_slots.py, every declared slot is emitted
# unconditionally (so the prompt's shape no longer varies with what an NPC happens to
# have), `system_state` and `active_quest` reach the model for the first time, and RAG
# hits moved out of `npc_known_events` into their own `retrieved_context` slot.
#
# compression_prompt_version is part of the compression cache key, so bumping it in the
# same change invalidates every stale compressed payload for free.
prompt_schema_version: "v1.5"
compression_prompt_version: "v1.5"
# Absolute per-tier ceilings, in tokens. These are a HARD min() applied on top of the
# fractional split, so they bind long before the fractions do: at the old 4000/3000/2000
# tier A could never exceed 4000 whatever the window, which made a window raise unable to
# widen tier A at all (_tier_a_cap_with_reclaim takes min(tier_budget_tokens.tier_a, ...)).
#
# P5 (2026-08-26): raised to 12000/8000/5000, sum 25000, against the derived budget
# max(512, 32768 - 6880) = 25888 at OLLAMA_CONTEXT_LENGTH=32768. Sum <= budget on purpose:
# these ceilings must not be the thing that binds during the measurement window, because
# P5 exists to observe what the context system asks for when NOTHING trims it.
#
# Provisional, re-decided in P10 alongside the window trim.
tier_budget_tokens:
  tier_a: 12000
  tier_b: 8000
  tier_c: 5000
session_turns_budget_tokens: 1200
compression_trigger_ratio: 0.85
max_proximity_hops: 2
relevance_weights:
  recency: 0.30
  severity: 0.20
  proximity: 0.20
  relation: 0.20
  quest: 0.10

# Retrieval profiles — the named A/B arms an eval run selects with
# `evals generate --profiles default,<name>` or a per-request
# DialogueRequest.retrieval_profile (DEC-194). Resolution is STRICT: an undeclared
# name is HTTP 400, never a silent fallback, so an arm can never record a profile it
# did not run.
#
# 'default' is NOT declared here and must not be: it is resolved from
# Settings.RAG_TOP_K / Settings.CROSS_ENCODER_ENABLED by build_default_profile, which
# is what keeps a no-profile turn byte-identical to a pre-profile one.
#
# Each arm below varies exactly ONE knob against that default. A two-knob arm produces
# a delta nobody can attribute, which is the defect DEC-194 fixed when it split
# RAG_TOP_K's three call sites apart.
#
# ONE ARM, ONE TIER (P9). `rag_top_k` and `graph_rag_top_k` count as one knob — same
# quantity, two call sites, GRAPH_RAG_ENABLED picks which fires. `events_limit` does
# NOT join them: it bounds get_events_for_npc, which fills tier-A `event:` items, while
# the top-ks bound the vector search that fills tiers B and C. Grouping all three was
# defensible only while every one of them was inert; P8 made tier B carry 2-3 items per
# NPC (DEC-212), so that grouping now hides which tier carried an effect. Pinned by
# test_no_declared_arm_varies_both_a_tier_a_and_a_tier_b_knob, which since DEC-214 also
# resolves `disabled_slots` to the tier of the slot it names.
#
# SUPPLY FIRST (DEC-214) — the rule, and the mistake it exists to prevent.
#
#   AN ARM MAY NOT BE DECLARED UNTIL ITS EXPOSURE HAS BEEN MEASURED.
#
# `wide_events` (events_limit 5 -> 15) and `wide_rag` (rag_top_k 5 -> 15) were declared
# here and both produced item_keys BYTE-IDENTICAL to default on 2/2 probe cases. Neither
# was a bug in the arm, the scope or the corpus: each RAISED A CEILING ABOVE ITS OWN
# SUPPLY, so there was nothing for the raise to take. They were sized against JUDGE
# RESOLUTION rather than against supply, which was the only axis available when they were
# written — tierB.items was 0 on every run ever recorded (DEC-208), so "does this arm
# change anything?" could not be asked at all.
#
# Measured on the clean eval baseline, 8-NPC roster, corpus_sha 2b19e47a1755354e:
#
#     knob           default   measured supply              headroom to RAISE
#     events_limit         5   max 2 known by ANY Character  0 on 8/8
#     rag_top_k            5   3-8 candidates per NPC        0 on 6/8
#
# So on this world a ceiling knob is an arm only when it is LOWERED. Every arm below
# subtracts. The measured supply each arm was sized against is recorded in the
# `retrieval_profile_exposure:` block after these profiles, and checked at design time by
# tests/unit/config/test_declared_arm_exposure.py; gate 4 of `make eval-arm-probe` is the
# runtime check that the recorded number is still true of the live world.
#
# WHAT IS INERT IN THIS BLOCK TODAY — read before designing an arm:
#
#   * `graph_rag_top_k` is INERT. Settings.GRAPH_RAG_ENABLED defaults False
#     (config.py:240), so context_builder._fetch_rag_results takes the
#     embedding_index.search branch and graph_rag_retrieve — the only reader of this
#     field — is never called. It moves with `rag_top_k` so that turning GraphRAG on
#     does not silently un-widen an arm; it contributes nothing on its own.
#
#   * `weight_profile` is INERT (ISSUE-203). detect_dialogue_profile returns
#     "rpg_dialogue_social" or "rpg_dialogue_quest", neither declared in any YAML, so
#     dialogue ranking weights resolve from the hardcoded Python dict
#     DEFAULT_WEIGHT_PROFILES. An arm varying this field varies NOTHING until those two
#     names are declared under a `weight_profiles:` block. Do not declare a weight arm
#     before then — it would record a variant it did not run, which is what DEC-194's
#     strict resolution exists to prevent.
#
#   * `rag_top_k` moves TIER B AND TIER C TOGETHER. _build_tier_b_c_items splits the
#     result list at `max(1, len // 2)` (context_builder.py:502) — first half tier B,
#     second half tier C. One mechanism, one knob, two tiers. A tier-C delta from this
#     arm is therefore NOT an independent effect and must not be reported as one
#     (DEC-209, "Recorded, not decided"; confirmed measured in DEC-212 as 2/3 and 2/2).
#
#   * `slot_cap_overrides` is applied PER ITEM, not per slot total
#     (context_profile_policy.apply_slot_policy). Measured `rag:` spend is 133-233 tokens
#     per NPC across 3-5 items, i.e. ~46 tokens PER ITEM against the default cap of 600.
#     A cap only binds below ~45, and a cap that binds routes every rag item through
#     byte truncation, which ISSUE-214 records as emitting invalid JSON. Not an arm until
#     ISSUE-214 is fixed, and it is not this knob's job to fix it (DEC-214).
#
#   * `cross_encoder_enabled` REORDERS candidates, it does not change membership; its
#     only effect on assembly is which half of the len//2 split each item lands in. It
#     also downloads an ~80 MB model on first use (cross_encoder_reranker._MODEL_NAME).
#     Untested as an arm and not declared as one.
#
#   * `enabled_tiers` minus tierB is a near-duplicate of `no_rag` on this world: it drops
#     the same `rag:` items PLUS `top_need`, which is structurally empty (ISSUE-210), so
#     the two arms would differ by nothing observable and cost two generation passes.
#
# The arms are deliberately DRASTIC. Measured resolution on the current batteries is a
# >=6.4pp drop on guard (n=78) before the regression gate fires, with refusal_judge at
# kappa 0.225 (ISSUE-184). A cautious arm cannot clear that floor; these are sized to
# produce an effect the instrument can see, or to establish that there is none. On this
# world "drastic" can only mean SUBTRACTIVE — see SUPPLY FIRST above.
# Pinned by tests/unit/config/test_shipped_retrieval_profiles.py.
retrieval_profiles:
  # Does tier-B retrieval change measured behaviour AT ALL? Nothing in this repo has
  # established that. The strongest available contrast, and the one whose null result
  # would be most informative: if guard and capability hold without retrieval, the
  # engine's grounding is coming from somewhere else.
  no_rag:
    weight_profile: null
    rag_top_k: 5
    graph_rag_top_k: 5
    events_limit: 5
    cross_encoder_enabled: false
    skip_rag: true
    # P8 §8.5: every declared arm carries the same `rag:` cap as the default, so the
    # arm differs from default in exactly ONE field. Vary the cap only in an arm whose
    # declared knob IS the cap.
    slot_cap_overrides:
      "rag:": 600

  # TIER B/C ARM. Cut the vector-search top-k below the smallest measured candidate set
  # and leave event fetching alone. This REPLACES `wide_rag` (rag_top_k 15), which was
  # retired for zero exposure: at a supply of 3-8 the default top-k of 5 already retrieves
  # substantially everything in scope, so raising it added at most one item on two of
  # eight NPCs and nothing at all on both probe cases.
  #
  # Down is the only direction this world offers. At rag_top_k=2 the len//2 split gives
  # tier B 1 item and tier C 1, against the default's 2 and 3 — and because 2 is strictly
  # below the minimum measured supply of 3, it binds on 8 of 8 NPCs rather than on the
  # two that happen to have spare supply. Measured removal: 1-3 items per NPC.
  #
  # Run against no_rag it is a dose-response pair on one axis: no_rag asks 'does ANY
  # retrieval matter', narrow_rag asks 'do two items suffice'.
  #
  # `events_limit` is pinned AT the default 5 on purpose — moving it would make this a
  # two-tier arm. See the ONE ARM, ONE TIER note above.
  narrow_rag:
    weight_profile: null
    rag_top_k: 2
    graph_rag_top_k: 2
    events_limit: 5
    cross_encoder_enabled: false
    skip_rag: false
    # P8 §8.5: every declared arm carries the same `rag:` cap as the default, so the
    # arm differs from default in exactly ONE field. Vary the cap only in an arm whose
    # declared knob IS the cap.
    slot_cap_overrides:
      "rag:": 600

  # TIER A ARM — the half P9 split out of wide_rag, now carried by a different knob.
  # This REPLACES `wide_events` (events_limit 15), which was retired for structurally
  # zero exposure: no Character in the eval world KNOWS_ABOUT more than 2 events, so the
  # DEFAULT limit of 5 already exceeds supply and the knob is dead at any value >= 2.
  # It was not resized, because there is no value of `events_limit` that is an arm here.
  #
  # `nearby_npcs` is the live tier-A replacement. It is a declared tier-A slot
  # (context_slots.py, priority 91) measured POPULATED on 8 of 8 roster NPCs, so
  # withholding it removes exactly one item per NPC — guaranteed exposure, and the reason
  # the tier-A/tier-B split P9 performed survives the retirement of both additive arms.
  #
  # Schema is unchanged: apply_slot_policy drops the ITEM, and the generated serializer
  # still emits the `nearby_npcs` key with its empty default. Two arms whose JSON differs
  # in shape would be measuring schema drift, not retrieval.
  no_nearby_npcs:
    weight_profile: null
    rag_top_k: 5
    graph_rag_top_k: 5
    events_limit: 5
    cross_encoder_enabled: false
    skip_rag: false
    disabled_slots:
      - nearby_npcs
    # P8 §8.5: every declared arm carries the same `rag:` cap as the default, so the
    # arm differs from default in exactly ONE field. Vary the cap only in an arm whose
    # declared knob IS the cap.
    slot_cap_overrides:
      "rag:": 600
