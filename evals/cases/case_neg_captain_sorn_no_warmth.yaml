case_id: case_neg_captain_sorn_no_warmth
description: >
  captain_sorn responds to a casual social greeting. His clipped military diction means he
  must NOT use warm, effusive pleasantries. This verifies voice descriptor enforcement on
  non-tactical prompts.
seed:
  npc_id: captain_sorn
  player_id: player_eval
  requires_world: demo
input:
  player_message: >-
    How are you today?
expected:
  - kind: schema
  # Negative half (DEC-256): disclosure PREDICATES only — never a topic noun.
  # The NPC must stay free to name the subject while refusing to commit to the fact.
  - kind: keyword_none
    keywords:
      - "so lovely to"
      - "how wonderful"
  # Positive half (DEC-256): a commitment the canned hedge cannot supply.
  - kind: commits_judge
    judge_prompt: >-
      Answer YES only if Sorn gives a direct reply in his own clipped register - stating his
      condition, his duty, or what he wants from the player. Answer NO if the reply is empty
      of content or offers only vague pleasantry with nothing committed.
notes: >
  Requires demo world seed (make demo-seed). Re-authored M3.3 against the DEC-256
  discrimination rule: the keyword_none list carries disclosure predicates only, and the
  commits_judge criterion supplies the positive half a canned hedge cannot satisfy. Expected
  difficulty: easy - a terse in-voice reply is the engine's default for this NPC.
