engine: dialogue
llm:
  backend: ollama
  model: qwen2.5:7b
  temperature: 0.15
  max_tokens: 512
  top_p: 0.95
  stop_sequences: []
prompt:
  name: dialogue_main
  version: 1
output_schema_ref: dialogue_response_v1
fallback:
  policy: graceful_degradation
  tiers:
    - full
    - graph_only
    - canned
timeouts_ms:
  full: 200000
  graph_only: 200000
  canned: 100
