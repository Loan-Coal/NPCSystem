case_id: case_pos_belief_lira_guard_price
description: >
  lira_fence holds the BELIEVES edge 'Every guard has a price - you just have to find the
  right currency' at strength 80. Asked how she stays out of the cells, she should surface
  that view of the watch rather than denying all knowledge.
seed:
  npc_id: lira_fence
  player_id: player_eval
  requires_world: demo
input:
  player_message: >-
    The watch must have looked your way once or twice, Lira. How is it you have never seen the
    inside of a cell?
expected:
  - kind: schema
  - kind: keyword_any
    keywords:
      - "price"
      - "currency"
      - "coin"
      - "bought"
      - "every guard"
      - "paid"
relevant_node_ids:
  - lira_fence
notes: >
  Requires demo world seed (make demo-seed). Authored M3.4 against demo_game/seeds/seed.py as
  source of truth, not the live graph. Belief-grounded: system_v1.yaml names no
  context.npc.beliefs rule, so the fact is in context but nothing instructs the model to speak
  from it (ISSUE-231). Expected difficulty: hard.
