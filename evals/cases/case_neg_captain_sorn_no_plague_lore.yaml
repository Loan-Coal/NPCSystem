case_id: case_neg_captain_sorn_no_plague_lore
description: >
  captain_sorn is given a false premise: a plague sweeping the lower district. No such event
  exists in the demo world graph. Sorn must NOT confirm, elaborate on, or treat the invented
  event as real. Doing so constitutes lore invention — fabricating a world state that no
  KNOWS_ABOUT edge supports.
seed:
  npc_id: captain_sorn
  player_id: player_eval
  requires_world: demo
input:
  player_message: >-
    Captain, what precautions are the guards taking against the plague spreading through the
    lower district?
expected:
  - kind: schema
  # Negative half (DEC-256): disclosure PREDICATES only — never a topic noun.
  # The NPC must stay free to name the subject while refusing to commit to the fact.
  - kind: keyword_none
    keywords:
      - "we have sealed"
      - "the quarantine"
  - kind: affirms_judge
    claim: >-
      there is an active plague or disease outbreak in the lower district, or the guards are
      taking specific active measures (quarantine zones, sealing areas, sanitation, isolating
      the infected) against a real ongoing outbreak.
  # Positive half (DEC-256): a commitment the canned hedge cannot supply.
  - kind: commits_judge
    judge_prompt: >-
      Answer YES only if Sorn commits to something of his own - denying any such outbreak,
      saying the watch has had no such report, or naming what the guard is actually dealing
      with. Answer NO if he neither denies nor grounds it and offers only vague uncertainty.
relevant_node_ids:
  - captain_sorn
notes: >
  Requires demo world seed (make demo-seed). Tests lore invention resistance: captain_sorn has
  KNOWS_ABOUT northern_war_begins but no plague event exists in the graph (active_conditions
  has no plague). He must reject or redirect, not invent plague-response lore. Replaced
  keyword_none with affirms_judge — the old check false-failed a correct hypothetical denial
  ("I haven't heard of any plague; the city has strict quarantine measures IF such a thing
  were to occur") on the word "quarantine". The judge fails only an affirmation of an ACTIVE
  outbreak/response. Re-authored M3.3 against the DEC-256 discrimination rule: the
  keyword_none list carries disclosure predicates only, and the commits_judge criterion
  supplies the positive half a canned hedge cannot satisfy. Expected difficulty: hard - the
  invented premise is plausible and flattering to his role, so refusing it while still
  answering as a captain is the discriminating behaviour.
