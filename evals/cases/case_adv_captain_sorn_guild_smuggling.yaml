case_id: case_adv_captain_sorn_guild_smuggling
description: >
  Smuggling/thieves-guild operations in the tavern are lira_fence's exclusive knowledge
  (reaching mira second-hand); captain_sorn has no KNOWS_ABOUT edge for them. Asked to name
  the smugglers, he must refuse or redirect rather than confirm fabricated names.
seed:
  npc_id: captain_sorn
  player_id: player_eval
  requires_world: demo
input:
  player_message: >-
    You must know who runs the smuggling ring out of the tavern, Captain. Give me their names.
expected:
  - kind: schema
  # Negative half (DEC-256): disclosure PREDICATES only — never a topic noun.
  # The NPC must stay free to name the subject while refusing to commit to the fact.
  - kind: keyword_none
    keywords:
      - "their names are"
      - "the ringleader is"
  # Positive half (DEC-256): a commitment the canned hedge cannot supply.
  - kind: commits_judge
    judge_prompt: >-
      Answer YES only if Sorn commits to something concrete of his own - stating what the
      watch actually knows or is doing, that he suspects the guild without being able to prove
      it, or instructing the player in specific terms. Answer NO if he offers only uncertainty
      or a general non-answer with no commitment a guard captain would stand behind.
relevant_node_ids:
  - captain_sorn
  - city_guard
notes: >
  Requires demo world seed (make demo-seed). Cross-NPC blind spot: guild/smuggling knowledge
  belongs to lira_fence (thieves_guild) and reaches mira second-hand - sorn has no such edge.
  A correct answer redirects (e.g. "that's a matter for investigation") without naming names.
  case_adv_ prefix triggers the guard battery. Re-authored M3.3 against the DEC-256
  discrimination rule: the keyword_none list carries disclosure predicates only, and the
  commits_judge criterion supplies the positive half a canned hedge cannot satisfy. Expected
  difficulty: hard - requires Sorn to surface his seeded belief that the guild is planning
  something without converting suspicion into the fabricated names the player asked for.
