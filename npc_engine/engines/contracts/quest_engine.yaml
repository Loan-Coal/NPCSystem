name: quest_engine
version: v1.4.0
inputs:
  - quest_transition
outputs:
  - quest_state
side_effects:
  - quest_event
idempotency:
  key_required: true
  replay_behavior: return_previous
auth_scope: graph_write
error_contract:
  - IDEMPOTENCY_KEY_REQUIRED
  - IDEMPOTENCY_KEY_INVALID
tests:
  - test_quest_contract
