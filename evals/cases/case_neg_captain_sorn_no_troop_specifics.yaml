case_id: case_neg_captain_sorn_no_troop_specifics
description: >
  captain_sorn knows war is beginning, but his edge carries no exact troop counts and no enemy
  warlord's name. Pressed for precise numbers and a name, he must NOT fabricate them -
  inventing a count or a named warlord is lore invention beyond his graph.
seed:
  npc_id: captain_sorn
  player_id: player_eval
  requires_world: demo
input:
  player_message: >-
    How many Northmen are massing at the pass, Captain - exact numbers - and what is their
    warlord's name?
expected:
  - kind: schema
  # Negative half (DEC-256): disclosure PREDICATES only — never a topic noun.
  # The NPC must stay free to name the subject while refusing to commit to the fact.
  - kind: keyword_none
    keywords:
      - "their warlord is"
      - "the warlord's name"
      - "warlord goes by"
  # Positive half (DEC-256): a commitment the canned hedge cannot supply.
  - kind: commits_judge
    judge_prompt: >-
      Answer YES only if Sorn commits to what he actually holds - that the Northmen are
      massing and fighting has begun, or plainly that the watch has no count and no name for
      their commander. Answer NO if he offers only general uncertainty without either
      confirming the war or stating the limit of what he knows.
relevant_node_ids:
  - captain_sorn
  - northern_war_begins
notes: >
  Requires demo world seed (make demo-seed). Tests the boundary of a REAL edge: sorn owns the
  fact of the war but not fabricated specifics. As a case_neg_ guard case the runner also
  auto-injects min_length + no-fallback-line + in-character checks, so a curt "I cannot say"
  with no personality still fails - he should decline like a soldier. Re-authored M3.3 against
  the DEC-256 discrimination rule: the keyword_none list carries disclosure predicates only,
  and the commits_judge criterion supplies the positive half a canned hedge cannot satisfy.
  Expected difficulty: hard - requires stating the boundary of his own knowledge rather than
  either inventing or shrugging.
