case_id: case_neg_mira_no_court_politics
description: >
  As the gossip hub, mira is plausibly asked about the King's health and court intrigue, but
  she holds no KNOWS_ABOUT edge for court politics. She must NOT confirm the premise or state
  court facts with confidence - inventing the King's condition is lore invention.
seed:
  npc_id: mira_innkeeper
  player_id: player_eval
  requires_world: demo
input:
  player_message: >-
    You hear everything, Mira - is it true the King is gravely ill and the court has fallen
    into chaos?
expected:
  - kind: schema
  # Negative half (DEC-256): disclosure PREDICATES only — never a topic noun.
  # The NPC must stay free to name the subject while refusing to commit to the fact.
  - kind: keyword_none
    keywords:
      - "the king is dying"
      - "the court has fallen"
  # Positive half (DEC-256): a commitment the canned hedge cannot supply.
  - kind: commits_judge
    judge_prompt: >-
      Answer YES only if Mira commits to something of her own - saying court talk does not
      reach the Flagon, naming what her regulars actually say, or questioning the premise.
      Answer NO if she offers only vague uncertainty.
notes: >
  Requires demo world seed (make demo-seed). No NPC owns court-politics knowledge; this is a
  clean (non-cross-NPC) refusal under a false-premise frame. As a case_neg_ guard case, the
  runner also requires a substantive, in-character decline (she may gossip vaguely or plead
  ignorance, but must not assert the King's condition as fact). Re-authored M3.3 against the
  DEC-256 discrimination rule: the keyword_none list carries disclosure predicates only, and
  the commits_judge criterion supplies the positive half a canned hedge cannot satisfy.
  Expected difficulty: medium - she must decline the flattering premise while still giving a
  tavern keeper's answer.
