case_id: case_003_trade_offer
description: >
  Merchant NPC receives a trade offer. Response should acknowledge
  the offer and indicate willingness to negotiate or complete the trade.

seed:
  npc_id: aldric_merchant
  player_id: player_eval
  location_id: loc_market_square
  requires_world: demo

input:
  player_message: "I'll give you ten gold coins for that sword."

expected:
  - kind: schema
  - kind: keyword_any
    keywords: ["gold", "coin", "sword", "deal", "trade", "offer", "sell", "buy", "price", "worth"]
  - kind: in_set
    field: facial_expression.type
    values: ["neutral", "smile", "surprised"]
  # propose_trade/propose_quest/claim_completion are valid ActionType values the engine
  # emits on a trade offer (system_v1 Rule 11); the prior list omitted them. Aligned with
  # dialogue_models.ActionType.
  - kind: in_set
    field: action.type
    values: ["speak", "sell_item", "buy_item", "none", "propose_trade", "propose_quest", "claim_completion"]
  - kind: range
    field: relation_deltas.trust
    min: -5
    max: 15
  - kind: tone_judge
    judge_prompt: >
      Does this NPC respond to a trade offer in a mercantile way — accepting the offer,
      negotiating on price, or redirecting the player to other available items? YES if
      the NPC engages commercially with the offer in any of these ways. NO if the NPC
      ignores the offer entirely, responds with hostility unrelated to trade, or leaves
      the commercial frame altogether.
