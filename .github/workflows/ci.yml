name: NPC Engine CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Lint
        run: make lint

  v13-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - test-v13-contracts
          - test-v13-graph-admin
          - test-v13-retrieval
    env:
      API_KEY_SECRET: "test-api-key-secret-ci"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run matrix target
        run: make ${{ matrix.target }}

  coverage-gate:
    runs-on: ubuntu-latest
    needs:
      - static-analysis
      - v13-tests
    env:
      API_KEY_SECRET: "test-api-key-secret-ci"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Test with v1.3 coverage gate
        run: make test-cov-v13

      - name: Full-suite coverage report (non-gating)
        run: make test-cov-full-report

  v14-p4-gates:
    runs-on: ubuntu-latest
    env:
      API_KEY_SECRET: "test-api-key-secret-ci"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Validate contracts
        run: make check-contracts

      - name: Guard contract YAML/test sync
        if: github.event_name == 'pull_request'
        run: |
          python -m npc_engine.scripts.guard_contract_test_sync --base-ref origin/${{ github.base_ref }}

      - name: Run v1.4 P4 test slice
        run: make test-v14-p4

  v14-p5-gates:
    runs-on: ubuntu-latest
    env:
      API_KEY_SECRET: "test-api-key-secret-ci"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run v1.4 P5 observability tests
        run: make test-v14-p5
