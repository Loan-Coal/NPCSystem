name: currency_engine
version: v1.4.0
uses_llm: false
inputs:
  - transfer_request
outputs:
  - transfer_result
side_effects:
  - currency_balance_update
idempotency:
  key_required: true
  replay_behavior: return_previous
auth_scope: graph_write
error_contract:
  - IDEMPOTENCY_KEY_REQUIRED
  - IDEMPOTENCY_KEY_INVALID
tests:
  - test_currency_contract
