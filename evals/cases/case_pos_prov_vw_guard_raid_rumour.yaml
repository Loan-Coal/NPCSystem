# grounded_by: see notes — every scoring token is drawn from the grounded node's text
case_id: case_pos_prov_vw_guard_raid_rumour
description: >
  vw_guard holds vw_bandit_raid at knowledge_state 'rumor' with minimization distortion — he
  heard it second-hand. Per docs/CASE_SET_POLICY.md hedging is a PASS here, so the case requires
  BOTH the raid facts and the hedging framing.
seed:
  npc_id: vw_guard
  player_id: player_eval
  requires_world: village
relevant_node_ids:
  - vw_guard
  - vw_bandit_raid
  - vw_gate
input:
  player_message: "Is the road out of here safe just now?"
expected:
  - kind: schema
  - kind: keyword_any
    keywords:
      - "farm"
      - "farmstead"
      - "east"
      - "bandits"
      - "livestock"
      - "grain"
  - kind: keyword_any
    keywords:
      - "i've heard"
      - "i have heard"
      - "they say"
      - "word is"
      - "apparently"
      - "rumour"
      - "rumor"
      - "second-hand"
      - "i'm told"
      - "so i'm told"
      - "supposedly"
      - "i could not say"
notes: >
  Grounding: KNOWS_ABOUT(vw_guard, vw_bandit_raid), knowledge_state=rumor,
  distortion=minimization/30 - verified live. Gossip polarity of the provenance pair with
  case_pos_prov_vw_elder_blight_direct. Both expectations must pass, which is what makes it
  ungameable: the canned hedge satisfies the marker list and fails the fact list, and a
  confident fabrication does the reverse.
