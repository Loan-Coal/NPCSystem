node_type: quest_template
fields:
  id:                   { type: str, required: true }
  name:                 { type: str, required: true }
  archetype:            { type: str, required: true }
  slot_definitions:     { type: str, required: true }
  description_template: { type: str, required: true }
  reward_template:      { type: str, required: true }
  severity:             { type: int, required: true, range: [0, 100] }
