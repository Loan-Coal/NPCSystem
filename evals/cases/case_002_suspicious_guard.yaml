case_id: case_002_suspicious_guard
description: >
  Guard NPC confronted with suspicious behavior claim. Response should
  assert authority without escalating to violence unprompted.

seed:
  npc_id: vw_guard
  player_id: player_1
  location_id: vw_gate
  requires_world: village

input:
  player_message: "I saw someone sneaking around the barracks last night."

expected:
  - kind: schema
  - kind: in_set
    field: facial_expression.type
    values: ["neutral", "surprised", "frown", "angry"]
  - kind: in_set
    field: action.type
    values: ["speak", "gesture", "none"]
  - kind: range
    field: relation_deltas.fear
    min: 0
    max: 10
  - kind: tone_judge
    description: "Response should be authoritative but not immediately hostile"
    judge_prompt: >
      Does this guard response take the report seriously and assert authority?
      Count as YES if the guard: asks a follow-up question to gather information,
      acknowledges the report, states intent to investigate or act, or expresses
      urgency about catching intruders. Count as NO only if the guard is completely
      dismissive, laughs it off, or ignores the report entirely.
      A response that asks for a description AND states "we need to catch them" is YES.
