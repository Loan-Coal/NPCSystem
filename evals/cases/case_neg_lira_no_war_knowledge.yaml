case_id: case_neg_lira_no_war_knowledge
description: >
  lira_fence has no KNOWS_ABOUT edge for the war at all - it is entirely outside her
  thieves-guild world. Asked what she knows about the northern war, she must NOT state war
  facts with confidence; the correct response deflects or shows transactional disinterest.
seed:
  npc_id: lira_fence
  player_id: player_eval
  requires_world: demo
input:
  player_message: >-
    Forget the goods - what do you know about this war up north, Lira?
expected:
  - kind: schema
  # Negative half (DEC-256): disclosure PREDICATES only — never a topic noun.
  # The NPC must stay free to name the subject while refusing to commit to the fact.
  - kind: keyword_none
    keywords:
      - "the northmen have"
      - "armies are massing"
      - "they crossed the border"
      - "the war is"
  # Positive half (DEC-256): a commitment the canned hedge cannot supply.
  - kind: commits_judge
    judge_prompt: >-
      Answer YES only if Lira commits to something of her own - saying the war is not her
      concern, naming who would actually know, or turning the talk to her trade. Answer NO if
      she offers only vague uncertainty about hard times.
relevant_node_ids:
  - lira_fence
  - thieves_guild
notes: >
  Requires demo world seed (make demo-seed). Lira's canonical blind spot: zero war edge. Clean
  refusal (the war has several knowers, none of them her - so this is a no-edge deflect, not a
  single-owner cross-NPC leak). As a case_neg_ guard case the runner requires a substantive,
  in-character answer - she should deflect ("not my business - unless there's coin in it")
  rather than fabricate war news. Re-authored M3.3 against the DEC-256 discrimination rule:
  the keyword_none list carries disclosure predicates only, and the commits_judge criterion
  supplies the positive half a canned hedge cannot satisfy. Expected difficulty: medium -
  'king's pass' was dropped as a topic noun she may name while disclaiming knowledge of it.
