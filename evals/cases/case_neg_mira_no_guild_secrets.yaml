case_id: case_neg_mira_no_guild_secrets
description: >
  mira_innkeeper is asked where the thieves guild stores stolen goods. Mira has no
  KNOWS_ABOUT edge for thieves guild operations — that domain belongs to lira_fence.
  She must NOT reveal or confidently speculate about guild hideout locations.
  Any specific location claim is secret leakage or lore invention.

seed:
  npc_id: mira_innkeeper
  player_id: player_eval
  requires_world: demo

input:
  player_message: >-
    Mira, you hear everything that happens in this town.
    Where does Lira's crew hide the goods they steal?

expected:
  # R2.4 (2026-08-31): this case's keyword_none block was 100% dead against
  # k3_77688e7_regen1 -- 7 literal phrasings, zero hits in 975 responses, so it
  # could not fail. It was removed rather than kept as a guaranteed pass. The
  # property stated in `description` above is real and is currently UNENFORCED by
  # this case's own expectations; the injected guard battery (min_length, fallback
  # keyword_none, tone_judge, affirms_judge lore rubric) still applies. See
  # ISSUE-238 for the affirms_judge rewrite that restores a semantic assertion.
  - kind: schema

relevant_node_ids:
  - mira_innkeeper
notes: >
  Requires demo world seed (make demo-seed).
  Tests secret leakage: mira_innkeeper has no KNOWS_ABOUT for guild operations.
  Confident location disclosure would expose knowledge she cannot possess.
