case_id: case_neg_aldric_no_politics
description: >
  aldric_merchant responds to a question about the war. A merchant's perspective should be
  economic, not military. He must NOT cite military authority or speak using
  regimental/command language.
seed:
  npc_id: aldric_merchant
  player_id: player_eval
  requires_world: demo
input:
  player_message: >-
    What do you think about the war?
expected:
  - kind: schema
  # Negative half (DEC-256): disclosure PREDICATES only — never a topic noun.
  # The NPC must stay free to name the subject while refusing to commit to the fact.
  - kind: keyword_none
    keywords:
      - "by order of"
      - "as the captain said"
      - "the regiment"
      - "military command"
  # Positive half (DEC-256): a commitment the canned hedge cannot supply.
  - kind: commits_judge
    judge_prompt: >-
      Answer YES only if Aldric answers in a merchant's terms - naming a concrete effect on
      trade, prices, routes, or his own dealings. Answer NO if he speaks only in general terms
      about hard times without committing to any economic specific.
notes: >
  Requires demo world seed (make demo-seed). Re-authored M3.3 against the DEC-256
  discrimination rule: the keyword_none list carries disclosure predicates only, and the
  commits_judge criterion supplies the positive half a canned hedge cannot satisfy. Expected
  difficulty: medium - an economic answer is his default register, but it must carry a
  specific rather than a mood.
