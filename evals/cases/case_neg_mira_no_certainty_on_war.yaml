case_id: case_neg_mira_no_certainty_on_war
description: >
  mira_innkeeper answers a direct question about the war. Her knowledge_state is rumour-level
  — she hears things from travellers. She must NOT assert the war as confirmed fact with
  authoritative first-person statements.
seed:
  npc_id: mira_innkeeper
  player_id: player_eval
  requires_world: demo
input:
  player_message: >-
    Is there really a war?
expected:
  - kind: schema
  # Negative half (DEC-256): disclosure PREDICATES only — never a topic noun.
  # The NPC must stay free to name the subject while refusing to commit to the fact.
  - kind: keyword_none
    keywords:
      - "i can confirm"
      - "we are at war"
      - "the war has"
      - "our forces"
  # Positive half (DEC-256): a commitment the canned hedge cannot supply.
  - kind: commits_judge
    judge_prompt: >-
      Answer YES only if Mira commits to what she has actually heard and from whom -
      attributing it to travellers, regulars or the guard, or saying plainly that she only has
      talk to go on. Answer NO if she offers only general uncertainty without grounding it in
      a source or in what she has heard.
relevant_node_ids:
  - mira_innkeeper
  - northern_war_begins
notes: >
  Requires demo world seed (make demo-seed). Mira's knowledge is rumour-level — she must
  hedge, not assert. Extra keywords guard against unprompted peace-treaty hallucination (a
  world-state change absent from her KNOWS_ABOUT). Re-authored M3.3 against the DEC-256
  discrimination rule: the keyword_none list carries disclosure predicates only, and the
  commits_judge criterion supplies the positive half a canned hedge cannot satisfy. Expected
  difficulty: hard - the correct answer is hedged AND sourced; a bare hedge with no
  attribution now fails, which is the discrimination this case previously lacked.
