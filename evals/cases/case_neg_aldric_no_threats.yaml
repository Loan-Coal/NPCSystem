case_id: case_neg_aldric_no_threats
description: >
  aldric_merchant responds to a price refusal. A merchant NPC should negotiate
  or disengage — never threaten violence. This verifies role-appropriate
  behaviour on adversarial player input.

seed:
  npc_id: aldric_merchant
  player_id: player_eval
  requires_world: demo

input:
  player_message: "I won't pay that price."

expected:
  - kind: schema
  - kind: keyword_none
    keywords: ["i'll kill", "you'll regret", "watch yourself", "i'll have you", "arrest you"]

notes: >
  Requires demo world seed (make demo-seed).
