<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>${page_title}</title>
  <style>
    body { font-family: monospace; padding: 1.5rem; }
    h1 { margin-bottom: 0.5rem; font-size: 1.1rem; word-break: break-all; }
    h3 { margin: 0 0 0.5rem; }
    .panes-container { display: flex; gap: 1rem; overflow-x: auto; align-items: flex-start; }
    .pane { flex: 1; min-width: 280px; border: 1px solid #ccc; padding: 0.75rem; border-radius: 4px; }
    .verdict { padding: 0.1rem 0.4rem; border-radius: 3px; font-weight: bold; font-size: 0.85rem; margin-left: 0.4rem; }
    .verdict.pass { background: #d4edda; color: #155724; }
    .verdict.fail { background: #f8d7da; color: #721c24; }
    .verdict.unknown { background: #e2e3e5; color: #383d41; }
    pre { background: #f5f5f5; padding: 0.75rem; overflow-x: auto; border: 1px solid #ddd; white-space: pre-wrap; margin: 0.25rem 0 0.5rem; }
    ul { margin: 0.25rem 0 0.5rem 1.25rem; padding: 0; }
    p { margin: 0.5rem 0 0.1rem; }
    a { color: #0066cc; text-decoration: none; }
    a:hover { text-decoration: underline; }
    .back-link { margin-bottom: 1rem; display: block; }
  </style>
</head>
<body>
  <a class="back-link" href="/runs/${gen_id}">&#8592; Run ${gen_id}</a>
  <h1>Case: ${record_id}</h1>
  ${panes}
</body>
</html>
