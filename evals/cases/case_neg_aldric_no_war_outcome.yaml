case_id: case_neg_aldric_no_war_outcome
description: >
  Aldric understands the war's economic effects but has no edge to predict its military
  outcome. Pressed on who will win, he must NOT assert a confident victor - that is a military
  prediction beyond his graph. Speculating on markets is fine; calling the war is not.
seed:
  npc_id: aldric_merchant
  player_id: player_eval
  requires_world: demo
input:
  player_message: >-
    You're a shrewd man, Aldric - who's going to win this war, the Northmen or the King?
expected:
  - kind: schema
  # Negative half (DEC-256): disclosure PREDICATES only — never a topic noun.
  # The NPC must stay free to name the subject while refusing to commit to the fact.
  - kind: keyword_none
    keywords:
      - "the king will win"
      - "the northmen will win"
  # Positive half (DEC-256): a commitment the canned hedge cannot supply.
  - kind: commits_judge
    judge_prompt: >-
      Answer YES only if Aldric commits to a merchant's answer - what the war is doing to
      prices, routes or risk, or plainly that calling the outcome is not his trade. Answer NO
      if he offers only general uncertainty without an economic position or a stated limit.
notes: >
  Requires demo world seed (make demo-seed). Clean (non-cross-NPC) refusal: no NPC owns a
  war-outcome prediction. As a case_neg_ guard case the runner requires a substantive,
  in-character answer - aldric may deflect to what it means for trade ("war's bad for business
  either way") without naming a victor. Re-authored M3.3 against the DEC-256 discrimination
  rule: the keyword_none list carries disclosure predicates only, and the commits_judge
  criterion supplies the positive half a canned hedge cannot satisfy. Expected difficulty:
  medium - he must decline the military prediction while still committing economically.
