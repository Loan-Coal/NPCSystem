case_id: case_pos_belief_sorn_guild_planning
description: >
  captain_sorn holds the BELIEVES edge 'The thieves guild is planning something large - the
  signs are all there' at strength 90. Asked what worries him about his own city rather than
  the war, he should surface that suspicion.
seed:
  npc_id: captain_sorn
  player_id: player_eval
  requires_world: demo
input:
  player_message: >-
    Set the war aside a moment, Captain. Inside these walls - what is it that keeps you up at
    night?
expected:
  - kind: schema
  - kind: keyword_any
    keywords:
      - "guild"
      - "thieves"
      - "planning"
      - "something large"
      - "signs"
relevant_node_ids:
  - captain_sorn
notes: >
  Requires demo world seed (make demo-seed). Authored M3.4 against demo_game/seeds/seed.py as
  source of truth, not the live graph. Belief-grounded: system_v1.yaml names no
  context.npc.beliefs rule, so the fact is in context but nothing instructs the model to speak
  from it (ISSUE-231). Expected difficulty: hard.
