name: NPC Engine CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  # One step, deliberately: `make check` is the canonical gate (DEC-238). Enumerating
  # target names here is what let CI drift to 6 of 17 while the other 11 passed locally,
  # so the gate set is named in exactly one place — the Makefile. Adding a gate to
  # `check:` enforces it on push with no edit to this file.
  # Pinned by tests/unit/scripts/test_ci_runs_the_full_gate.py.
  full-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      API_KEY_SECRET: "test-api-key-secret-ci"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Full gate (19 targets)
        run: make check

  # demo_game/ was gated by nothing: 256 mypy errors across 45 files and a test suite CI
  # never ran (R2.2). Its own job, not a `check:` prerequisite — test-demo needs pygame-ce,
  # networkx and matplotlib, which .[dev] does not install, and `make check` should not
  # require a display stack. Mirrors the existing separation in loop_gates.DEMO_GATE_CMD.
  demo-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      API_KEY_SECRET: "test-api-key-secret-ci"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
          pip install -r demo_game/requirements.txt

      - name: demo_game tests
        run: make test-demo

      - name: demo_game type ratchet (baseline 256)
        run: make type-demo

  # The integration suite has never run in CI: 34 of its 43 tests skip without NEO4J_*,
  # so CI stayed green over a suite that never executed (R2.2, CR-L14-02).
  # Neo4j comes up through the compose override, not a `services:` block, per ROADMAP and
  # DEC-232 — CI then runs the identical stack as local. The service is NAMED: a bare
  # `up -d` would also start `app`, which builds from Dockerfile and needs an env_file
  # `.env` that is not in the repo. Verified 2026-09-01 with the compose files in a
  # directory containing no `.env`: `up -d neo4j` and `down -v` both succeed (compose
  # resolves env_file only for the services it touches), while a full `compose config`
  # fails. So do not add a `compose config` step here, and do not drop the service name.
  integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      API_KEY_SECRET: "test-api-key-secret-ci"
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Start Neo4j (compose override, ISSUE-232)
        run: docker compose -f docker-compose.yml -f docker-compose.test.yml up -d neo4j

      # Container health probes HTTP :7474 and goes green before bolt :7687 accepts
      # connections. Those two disagreed for months and produced 34 phantom failures
      # (DEC-235 / ISSUE-232), so wait on the driver, not on the healthcheck.
      - name: Wait for bolt to answer
        run: |
          PROBE="from neo4j import GraphDatabase; d=GraphDatabase.driver('bolt://localhost:7687', auth=('neo4j','password')); d.verify_connectivity(); d.close()"
          for i in $(seq 1 30); do
            if python -c "$PROBE" 2>/dev/null; then
              echo "bolt reachable after ${i} attempt(s)"
              exit 0
            fi
            sleep 5
          done
          echo "bolt never became reachable on localhost:7687 after 150s"
          docker compose -f docker-compose.yml -f docker-compose.test.yml logs neo4j | tail -50
          exit 1

      - name: Integration ratchet (8 known-failing, ISSUE-236)
        run: make check-integration-baseline

      - name: Stop Neo4j
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.test.yml down -v

  v13-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - test-v13-contracts
          - test-v13-graph-admin
          - test-v13-retrieval
    env:
      API_KEY_SECRET: "test-api-key-secret-ci"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run matrix target
        run: make ${{ matrix.target }}

  v14-p4-gates:
    runs-on: ubuntu-latest
    env:
      API_KEY_SECRET: "test-api-key-secret-ci"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Validate contracts
        run: make check-contracts

      - name: Guard contract YAML/test sync (PR — against base ref)
        if: github.event_name == 'pull_request'
        run: |
          python -m npc_engine.scripts.guard_contract_test_sync --base-ref origin/${{ github.base_ref }}

      - name: Guard contract YAML/test sync (push)
        if: github.event_name == 'push'
        run: make check-contract-sync

      - name: Run v1.4 P4 test slice
        run: make test-v14-p4

  v14-p5-gates:
    runs-on: ubuntu-latest
    env:
      API_KEY_SECRET: "test-api-key-secret-ci"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run v1.4 P5 observability tests
        run: make test-v14-p5
