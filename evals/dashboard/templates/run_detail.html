<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>${page_title}</title>
  <style>
    body { font-family: monospace; padding: 1.5rem; }
    h1 { margin-bottom: 0.5rem; }
    h2 { margin: 1.5rem 0 0.5rem; border-bottom: 1px solid #ddd; padding-bottom: 0.25rem; }
    .headline { font-size: 1.25rem; margin-bottom: 1rem; }
    .headline .k-label { font-weight: bold; border: 1px solid #555; padding: 0.1rem 0.4rem; margin-left: 0.4rem; border-radius: 3px; }
    .headline-card { background: #f9f9f9; border: 1px solid #ddd; padding: 0.75rem 1rem; margin-bottom: 1rem; border-radius: 4px; }
    .headline-card h2 { border: none; margin: 0 0 0.5rem; padding: 0; font-size: 1rem; }
    .card-meta { color: #555; margin-top: 0.4rem; }
    .refusal { color: #c0392b; font-weight: bold; }
    table { border-collapse: collapse; width: 100%; }
    th, td { border: 1px solid #ccc; padding: 0.4rem 0.8rem; text-align: left; }
    th { background: #f0f0f0; }
    .stable_pass { color: #1a7a1a; }
    .flaky { color: #b36600; }
    .stable_fail { color: #c0392b; }
    pre { background: #f5f5f5; padding: 1rem; overflow-x: auto; border: 1px solid #ddd; }
    .calibration-badge { background: #e8f4fd; padding: 0.75rem; border-left: 4px solid #3498db; margin-bottom: 0.5rem; }
    .calibration-badge ul { margin: 0.25rem 0 0 1rem; padding: 0; }
    .na { color: #888; font-style: italic; }
    a { color: #0066cc; text-decoration: none; }
    a:hover { text-decoration: underline; }
    .back-link { margin-bottom: 1rem; display: block; }
    .empty-state { color: #666; font-style: italic; }
  </style>
</head>
<body>
  <a class="back-link" href="/">&#8592; All runs</a>
  <h1>${gen_id}</h1>
  <p class="headline">Pass rate: ${pass_rate_pct}&nbsp;<span class="k-label">k=${k}</span>&nbsp;(${passes}/${total} records)</p>

  ${headline_card}

  <h2>Calibration</h2>
  ${calibration_badge}

  <h2>Deterministic rates (EVAL-P3)</h2>
  ${deterministic_rates}

  <h2>Config</h2>
  <pre>${config_block}</pre>

  <h2>Flaky table</h2>
  ${flaky_table}
</body>
</html>
