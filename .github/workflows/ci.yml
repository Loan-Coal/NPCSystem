name: NPC Engine CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  static-analysis:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: npc_engine
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint
        run: make lint

      - name: Type check
        run: make type

  v13-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - test-v13-contracts
          - test-v13-graph-admin
          - test-v13-retrieval
    defaults:
      run:
        working-directory: npc_engine
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run matrix target
        run: make ${{ matrix.target }}

  coverage-gate:
    runs-on: ubuntu-latest
    needs:
      - static-analysis
      - v13-tests
    defaults:
      run:
        working-directory: npc_engine
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Test with v1.3 coverage gate
        run: make test-cov-v13

      - name: Full-suite coverage report (non-gating)
        run: make test-cov-full-report
